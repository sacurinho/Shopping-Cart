<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Administração de Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <link rel="stylesheet" href="admin-style.css">
</head>

<body>

    <header class="header">
        <div class="logo">Admin</div>
    </header>

    <main class="main-content">
        <!-- Formulário para adicionar/editar produtos -->
        <div class="admin-section">
            <h2 id="form-title">Adicionar Novo Produto</h2>
            <form id="product-form" class="admin-form">
                <input type="hidden" id="product-id">
                <label for="product-name">Nome do Produto:</label>
                <input type="text" id="product-name" required>
                <label for="product-price">Preço do Produto (MZN):</label>
                <input type="number" id="product-price" step="0.01" required>
                <button type="submit" id="submit-btn">Adicionar Produto</button>
            </form>
        </div>

        <!-- Tabela de produtos -->
        <div class="admin-section">
            <h2>Lista de Produtos (<span id="product-count">0</span>)</h2>
            <div class="product-table-container">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <!-- Produtos serão renderizados aqui pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>© 2025. Loja X</div>
        <div>TG1 - PROGWEBIII - G1</div>
    </footer>

    <script src="js/admin-model.js"></script>
    <script src="js/admin-view.js"></script>
    <script src="js/admin-controller.js"></script>
    <script src="js/admin-script.js"></script>

   
</body>

</html>
